version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecommerce-agent-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override specific env vars here if needed without touching .env
      - APP_ENV=development
    volumes:
      # Hot-reload source in dev — remove in production
      - .:/app
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
